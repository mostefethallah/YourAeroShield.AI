name: Collect and Store Readings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs: 
  collect-and-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip requests pandas psycopg2-binary

      - name: Collect and store reading
        run: python3 collect_and_store.py

      - name: Simulate indoor reading
        run: python3 simulate_indoor.py

